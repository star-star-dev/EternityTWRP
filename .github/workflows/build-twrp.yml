name: Build TWRP (Star7TWRP d2xks)

on:
  workflow_dispatch:
  push:
    branches:
      - star7-d2xks

jobs:
  build:
    name: Build Star7TWRP for d2xks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 bc rsync ccache liblz4-tool lzop libssl-dev \
            libncurses5-dev imagemagick

      - name: Set up repo tool
        run: |
          mkdir -p "${HOME}/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "${HOME}/bin/repo"
          chmod a+x "${HOME}/bin/repo"
          sudo ln -sf "${HOME}/bin/repo" /usr/bin/repo
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Init TWRP manifest (twrp-12.1)
        run: |
          repo init --depth=1 --no-tags \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync sources
        run: repo sync -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: Clone this device tree
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" \
            -b "${GITHUB_REF_NAME}" device/samsung/d2xks

      - name: Patch the language default and persistence
        run: |
          python3 device/samsung/d2xks/scripts/patch_language.py \
            bootable/recovery

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery image
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_d2xks-eng
          mka recoveryimage -j"$(nproc --all)"

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp out/target/product/d2xks/recovery.img \
             "artifact/Star7TWRP-d2xks.img"
          python3 device/samsung/d2xks/scripts/lzma_ramdisk.py \
             "artifact/Star7TWRP-d2xks.img" \
             "artifact/Star7TWRP-d2xks.img.lzma"
          mv -f "artifact/Star7TWRP-d2xks.img.lzma" \
             "artifact/Star7TWRP-d2xks.img"
          python3 device/samsung/d2xks/scripts/patch_blankwrites.py \
             "artifact/Star7TWRP-d2xks.img" \
             "artifact/Star7TWRP-d2xks.img.patched"
          mv -f "artifact/Star7TWRP-d2xks.img.patched" \
             "artifact/Star7TWRP-d2xks.img"
          cp device/samsung/d2xks/prebuilt/vbmeta.img \
             "artifact/vbmeta.img"
          ls -l artifact

      - name: Upload recovery image
        uses: actions/upload-artifact@v7
        with:
          name: Star7TWRP-d2xks
          path: |
            artifact/Star7TWRP-d2xks.img
            artifact/vbmeta.img
          if-no-files-found: error
